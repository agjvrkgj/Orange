name: V2Board contract

on:
  pull_request:
    paths:
      - '.github/workflows/v2board-contract.yaml'
      - 'lib/sdk/flutter_v2board_sdk/**'
      - 'lib/xboard/**'
      - 'test/xboard/v2board_*.dart'
      - 'pubspec.yaml'
      - 'pubspec.lock'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get dependencies and generate V2Board SDK
        working-directory: lib/sdk/flutter_v2board_sdk
        run: |
          flutter pub get
          dart run build_runner build --delete-conflicting-outputs

      - name: Run V2Board contract tests
        working-directory: lib/sdk/flutter_v2board_sdk
        run: flutter test test/v2board_contract_test.dart
